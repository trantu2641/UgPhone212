name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'UgCloudiOS/**'
      - '.github/workflows/build-ipa.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          xcodebuild -version
          xcodebuild -list -project UgCloudiOS/UgCloudiOS.xcodeproj

      - name: Build unsigned iOS app
        run: |
          set -o pipefail
          xcodebuild \
            -project UgCloudiOS/UgCloudiOS.xcodeproj \
            -scheme UgCloudiOS \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build | tee "$RUNNER_TEMP/xcodebuild.log"

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/UgCloudiOS.app"
          test -d "$APP" || { echo "Build output not found: $APP"; exit 1; }
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP" "$RUNNER_TEMP/ipa/Payload/UgCloudiOS.app"
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/ipa/Payload" "$RUNNER_TEMP/UgCloudiOS-unsigned.ipa"
          cp "$RUNNER_TEMP/xcodebuild.log" "$RUNNER_TEMP/xcodebuild.log.copy"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: UgCloudiOS-unsigned-IPA
          path: ${{ runner.temp }}/UgCloudiOS-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: UgCloudiOS-build-log
          path: ${{ runner.temp }}/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7
